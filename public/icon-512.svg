<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>

  <!-- Geometric Hexagon Badge -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" 
           fill="none" 
           stroke="url(#primaryGrad)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#glow)" />

  <!-- Inner Code & System Monogram (A + Terminal Cursor) -->
  <path d="M190 350 L256 180 L322 350" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M214 296 L298 296" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Modern Accent Dot -->
  <circle cx="256" cy="180" r="14" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Terminal prompt accent '>_' -->
  <polyline points="154,236 172,254 154,272" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="338" y1="272" x2="356" y2="272" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
</svg>
